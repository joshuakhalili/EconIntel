<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EconIntel — AI Economic Intelligence</title>
<meta name="description" content="Tracking artificial intelligence's measurable effect on the world economy, from official statistics.">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231F7A4D'/><path d='M8 21l5-6 4 3 6-8' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>

<a href="#main" class="sr-only">Skip to main content</a>

<div class="shell">

  <!-- ── Left rail ──────────────────────────────────────────────────────── -->
  <nav class="rail" aria-label="Sections">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">EI</span>
      <span>EconIntel</span>
    </div>

    <div class="nav-group">
      <div class="nav-label" id="nav-overview">Overview</div>
      <button class="nav-item" data-view="dashboard" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </button>
    </div>

    <div class="nav-group">
      <div class="nav-label">Pillars</div>
      <button class="nav-item" data-view="pillar" data-pillar="adoption">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3 17l6-6 4 4 8-9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Adoption <span class="nav-count" data-count="adoption"></span>
      </button>
      <button class="nav-item" data-view="pillar" data-pillar="infrastructure">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M7 8V5a2 2 0 012-2h6a2 2 0 012 2v3M7 13h2M7 16h2" stroke-linecap="round"/></svg>
        Infrastructure <span class="nav-count" data-count="infrastructure"></span>
      </button>
      <button class="nav-item" data-view="pillar" data-pillar="effects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 3v18M5 8c3 0 4 8 7 8s4-8 7-8" stroke-linecap="round"/></svg>
        Effects <span class="nav-count" data-count="effects"></span>
      </button>
      <button class="nav-item" data-view="pillar" data-pillar="policy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M4 21h16M6 21V8l6-4 6 4v13M10 21v-5h4v5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Policy <span class="nav-count" data-count="policy"></span>
      </button>
    </div>

    <div class="nav-group">
      <div class="nav-label">Intelligence</div>
      <button class="nav-item" data-view="news">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h6M7 13h10M7 16h7" stroke-linecap="round"/></svg>
        News <span class="nav-count" data-count="news"></span>
      </button>
      <button class="nav-item" data-view="indicators">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round"/></svg>
        All indicators <span class="nav-count" data-count="all"></span>
      </button>
      <button class="nav-item" data-view="status">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Pipeline status
      </button>
    </div>

    <div class="rail-foot">
      <button class="nav-item" id="theme-toggle" aria-label="Switch colour theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" stroke-linecap="round"/></svg>
        <span id="theme-label">Theme</span>
      </button>
    </div>
  </nav>

  <!-- ── Main ───────────────────────────────────────────────────────────── -->
  <div class="main">
    <header class="topbar" id="topbar">
      <div>
        <h1 class="page-title" id="page-title">Dashboard</h1>
        <p class="page-sub" id="page-sub">Loading…</p>
      </div>
      <div class="topbar-actions">
        <button class="btn" id="refresh-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M20 11a8 8 0 10-2.3 5.7M20 5v6h-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Refresh
        </button>
      </div>
    </header>

    <main class="content" id="main" tabindex="-1">
      <div id="view" aria-live="polite">
        <div class="loading">Loading dashboard…</div>
      </div>
    </main>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
