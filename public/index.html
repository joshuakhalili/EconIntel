<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EconIntel — Is AI changing the economy?</title>
<meta name="description" content="Tracking artificial intelligence's measurable effect on the world economy, from official statistics.">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231F7A4D'/><path d='M8 21l5-6 4 3 6-8' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>

<a href="#main" class="skip-link">Skip to main content</a>

<div class="shell">

  <nav class="rail" aria-label="Sections">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">EI</span>
      <span>EconIntel</span>
    </div>

    <!-- Navigation is built from /api/lenses. The pages a reader can visit are
         editorial data, so they are not hard-coded here. The count beside each
         lens is questions·tickers. -->
    <div class="nav-group">
      <div class="nav-label">Lenses</div>
      <div id="nav-lenses">
        <div class="skeleton" style="height:30px;margin:4px 8px"></div>
        <div class="skeleton" style="height:30px;margin:4px 8px"></div>
        <div class="skeleton" style="height:30px;margin:4px 8px"></div>
      </div>
    </div>

    <div class="nav-group">
      <div class="nav-label">Tools</div>
      <button class="nav-item" data-view="explore">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3 17l6-6 4 4 8-9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="11" r="1.6"/></svg>
        Build a chart
      </button>
      <button class="nav-item" data-view="news">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h6M7 13h10M7 16h7" stroke-linecap="round"/></svg>
        News <span class="nav-count" data-count="news"></span>
      </button>
      <button class="nav-item" data-view="pipeline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Where this comes from
      </button>
    </div>

    <div class="rail-foot">
      <!-- Reader mode. The same finding has to reach a generalist and a
           researcher; this switches which register of the stored text is
           shown, not which application is running. -->
      <div class="mode-switch" role="group" aria-label="Reading level">
        <button class="mode-btn" data-mode="plain" aria-pressed="true">Plain</button>
        <button class="mode-btn" data-mode="expert" aria-pressed="false">Technical</button>
      </div>
      <button class="nav-item" id="theme-toggle" aria-label="Switch colour theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" stroke-linecap="round"/></svg>
        <span id="theme-label">Theme</span>
      </button>
    </div>
  </nav>

  <div class="main">
    <header class="topbar" id="topbar">
      <div class="topbar-text">
        <h1 class="page-title" id="page-title">EconIntel</h1>
        <p class="page-sub" id="page-sub">Loading…</p>
      </div>
      <div class="topbar-actions">
        <button class="btn" id="refresh-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M20 11a8 8 0 10-2.3 5.7M20 5v6h-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Refresh
        </button>
      </div>
    </header>

    <main class="content" id="main" tabindex="-1">
      <div id="view" aria-live="polite">
        <div class="loading">Loading…</div>
      </div>
    </main>
  </div>

  <!-- Context drawer: what was happening when a chart point was clicked. -->
  <aside class="drawer" id="drawer" aria-label="Context" hidden>
    <div class="drawer-head">
      <div>
        <h2 class="drawer-title" id="drawer-title">Around this time</h2>
        <p class="drawer-sub" id="drawer-sub"></p>
      </div>
      <button class="icon-btn" id="drawer-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
